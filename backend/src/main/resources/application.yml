spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:visit_pass}
    username: ${DB_USER:visit_pass_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:changeme-base64-secret}
    issuer: ${JWT_ISSUER:visit-pass}
    access-minutes: 15
    refresh-days: 14
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:changeme}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
    cookie-secure: ${COOKIE_SECURE:false}
